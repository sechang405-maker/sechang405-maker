name: Update contribution caterpillar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check contribution token
        env:
          SNAKE_READ_TOKEN: ${{ secrets.SNAKE_READ_TOKEN }}
        run: |
          if [ -z "$SNAKE_READ_TOKEN" ]; then
            echo "::error::SNAKE_READ_TOKEN is required to include private contributions"
            exit 1
          fi

      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.SNAKE_READ_TOKEN }}
          outputs: |
            dist/caterpillar.svg?palette=github-light&color_snake=#A3E635
            dist/caterpillar-dark.svg?palette=github-dark&color_snake=#A3E635

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
